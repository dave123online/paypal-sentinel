<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PayPal Sentinel — Command Center</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/styles/ag-grid.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/styles/ag-theme-quartz.css" />
  <link rel="stylesheet" href="/dashboard/src/style.css" />
</head>
<body>

  <!-- ═══ HEADER ═══ -->
  <header class="top-bar">
    <div class="top-bar-left">
      <span class="logo">🛡️</span>
      <h1>PayPal Sentinel</h1>
      <nav class="top-nav">
        <a href="/dashboard" class="nav-link active">Dashboard</a>
        <a href="/docs" class="nav-link" target="_blank">API Docs</a>
        <a href="/health" class="nav-link" target="_blank">Health</a>
      </nav>
    </div>
    <div class="top-bar-right">
      <span id="gemini-status" class="status-dot" title="Gemini"></span>
      <span id="paypal-status" class="status-dot" title="PayPal Sandbox"></span>
      <span id="status-text">Chargement…</span>
    </div>
  </header>

  <!-- ═══ KPI CARDS ═══ -->
  <section class="kpi-row">
    <div class="kpi-card kpi-protected">
      <span class="kpi-value" id="kpi-protected">0 €</span>
      <span class="kpi-label">Protégés par Shield</span>
    </div>
    <div class="kpi-card kpi-alerts">
      <span class="kpi-value" id="kpi-alerts">0</span>
      <span class="kpi-label">Alertes actives</span>
    </div>
    <div class="kpi-card kpi-transactions">
      <span class="kpi-value" id="kpi-transactions">0</span>
      <span class="kpi-label">Transactions analysées</span>
    </div>
    <div class="kpi-card kpi-ally">
      <span class="kpi-value" id="kpi-ally">0</span>
      <span class="kpi-label">Opportunités Ally</span>
    </div>
  </section>

  <!-- ═══ MAIN CONTENT ═══ -->
  <main class="main-grid">

    <!-- Shield Feed -->
    <section class="panel shield-panel">
      <h2>🛡️ Shield Activity</h2>
      <div id="shield-feed" class="feed"></div>
    </section>

    <!-- Ally Panel -->
    <section class="panel ally-panel">
      <h2>🤝 Ally Growth</h2>
      <div id="ally-feed" class="feed"></div>
    </section>

  </main>

  <!-- ═══ AG GRID TABLES ═══ -->
  <section class="tables-section">
    <h2>📊 Données détaillées</h2>
    <div class="table-wrapper">
      <h3>Shield — verdicts</h3>
      <div id="shieldGrid" class="ag-theme-quartz grid"></div>
    </div>
    <div class="table-wrapper">
      <h3>Ally — suggestions</h3>
      <div id="allyGrid" class="ag-theme-quartz grid"></div>
    </div>
  </section>

  <!-- ═══ MODAL ═══ -->
  <div id="modal-overlay" style="display:none">
    <div class="modal-box">
      <h3 id="modal-title"></h3>
      <p id="modal-text"></p>
      <button id="modal-close">Fermer</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@32.3.3/dist/ag-grid-community.min.js"></script>
  <script src="/dashboard/src/main.js"></script>
</body>
</html>
